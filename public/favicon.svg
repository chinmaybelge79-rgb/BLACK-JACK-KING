<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#00b894"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  
  <!-- Card shape -->
  <g transform="translate(20, 15)">
    <rect width="60" height="84" rx="8" fill="white" filter="url(#glow)"/>
    
    <!-- Top left -->
    <text x="8" y="20" font-family="monospace" font-size="16" font-weight="bold" fill="url(#primary)">A</text>
    <text x="8" y="34" font-family="monospace" font-size="14" fill="url(#primary)">♠</text>
    
    <!-- Center large spade -->
    <text x="30" y="58" font-family="monospace" font-size="36" font-weight="300" fill="url(#primary)" text-anchor="middle" dominant-baseline="middle">♠</text>
    
    <!-- Bottom right (rotated) -->
    <g transform="translate(52, 80) rotate(180)">
      <text x="0" y="0" font-family="monospace" font-size="16" font-weight="bold" fill="url(#primary)" text-anchor="end">A</text>
      <text x="0" y="14" font-family="monospace" font-size="14" fill="url(#primary)" text-anchor="end">♠</text>
    </g>
  </g>
  
  <!-- Chips at bottom -->
  <g transform="translate(50, 95)">
    <circle cx="-18" cy="0" r="7" fill="#ffffff" stroke="#000" stroke-width="0.5"/>
    <circle cx="-6" cy="0" r="7" fill="#ef4444" stroke="#000" stroke-width="0.5"/>
    <circle cx="6" cy="0" r="7" fill="#22c55e" stroke="#000" stroke-width="0.5"/>
    <circle cx="18" cy="0" r="7" fill="#0f0f17" stroke="#fff" stroke-width="0.5"/>
  </g>
</svg>